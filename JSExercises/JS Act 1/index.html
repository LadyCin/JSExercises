<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>JS Exercise 1</h1>

    <table>
        <tr>
            <td>Enter First Number:</td>
            <td><input type="number" id="num1"></td>
        </tr>
        <tr>
            <td>Enter Second Number:</td>
            <td><input type="number" id="num2"></td>
        </tr>
        <tr>
            <td></td>
            <td>
                <button onclick="calculate()">Calculate</button>
                <button onclick="clearFields()">Clear</button>
            </td>
        </tr>
    </table>

    <br>

    <table>
        <tr>
            <td>Sum:</td>
            <td id="sum"></td>
        </tr>
        <tr>
            <td>Difference:</td>
            <td id="diff"></td>
        </tr>
        <tr>
            <td>Product:</td>
            <td id="prod"></td>
        </tr>
        <tr>
            <td>Quotient:</td>
            <td id="quot"></td>
        </tr>
    </table>

    <script>
        function calculate() {
            const val1 = document.getElementById("num1").value;
            const val2 = document.getElementById("num2").value;

            if (val1 === "" || val2 === "") {
                return;
            }

            const num1 = parseFloat(val1);
            const num2 = parseFloat(val2);

            document.getElementById("sum").innerText = num1 + num2;
            document.getElementById("diff").innerText = num1 - num2;
            document.getElementById("prod").innerText = num1 * num2;
            document.getElementById("quot").innerText = num2 !== 0 ? (num1 / num2) : "Cannot divide by 0";
        }

        function clearFields() {
            document.getElementById("num1").value = "";
            document.getElementById("num2").value = "";
            document.getElementById("sum").innerText = "";
            document.getElementById("diff").innerText = "";
            document.getElementById("prod").innerText = "";
            document.getElementById("quot").innerText = "";
        }
    </script>
</body>
</html>
